[project]
name = "shelfiq-backend"
version = "0.1.0"
description = "ShelfDekho retail analytics API: sales insights, demand forecasting and an AI SQL analyst"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "sqlglot>=25.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "redis>=5.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # formatter owns line length; long SQL literals are fine

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: tests that need a running Postgres"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
